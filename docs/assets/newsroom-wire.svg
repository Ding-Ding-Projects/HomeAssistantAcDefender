<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AC Defender newsroom wire graphic</title>
  <desc id="desc">An editorial wire illustration of a thermostat signal moving through evidence, a decision, and a safe command.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f9fbfb"/>
      <stop offset="1" stop-color="#e4f3f0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b7d8d5" stroke-opacity=".48"/>
    </pattern>
  </defs>
  <rect width="1200" height="720" rx="36" fill="url(#paper)"/>
  <rect x="32" y="32" width="1136" height="656" rx="26" fill="url(#grid)"/>
  <path d="M88 138H1112M88 582H1112" stroke="#0f766e" stroke-opacity=".25" stroke-width="3"/>
  <text x="88" y="112" fill="#0f766e" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">THE DEFENDER DISPATCH / FIELD NOTE 01</text>
  <g font-family="Arial, sans-serif" font-weight="700">
    <rect x="94" y="248" width="236" height="146" rx="18" fill="#fff" stroke="#a9ceca" stroke-width="4"/>
    <text x="126" y="290" fill="#111827" font-size="21">REAL INPUTS</text>
    <text x="126" y="330" fill="#4b5563" font-size="18">room · wall · weather</text>
    <text x="126" y="360" fill="#4b5563" font-size="18">Home Assistant context</text>
    <rect x="482" y="226" width="236" height="190" rx="118" fill="#0f766e"/>
    <circle cx="600" cy="321" r="74" fill="#e4f3f0"/>
    <path d="M600 263v60l36 24" fill="none" stroke="#111827" stroke-width="10" stroke-linecap="round"/>
    <text x="514" y="449" fill="#0f766e" font-size="21">BOUND DECISION</text>
    <rect x="870" y="248" width="236" height="146" rx="18" fill="#fff" stroke="#b9c2cb" stroke-width="4"/>
    <text x="902" y="290" fill="#111827" font-size="21">SAFE ACTION</text>
    <text x="902" y="330" fill="#4b5563" font-size="18">small step or hold</text>
    <text x="902" y="360" fill="#4b5563" font-size="18">real service call</text>
  </g>
  <g fill="none" stroke="url(#ink)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M338 322h130"/>
    <path d="m430 286 42 36-42 36"/>
    <path d="M724 322h130"/>
    <path d="m814 286 42 36-42 36"/>
  </g>
  <g fill="#b83227">
    <circle cx="88" cy="582" r="9"/><circle cx="1112" cy="582" r="9"/>
  </g>
  <text x="88" y="632" fill="#4b5563" font-family="Georgia, serif" font-size="24">A newsroom view of the rule: evidence first, clarity next, action last.</text>
</svg>
